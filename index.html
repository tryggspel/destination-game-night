/* Karlstad broadcast package */
.film-player {display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:14px;height:100svh;padding:3vh 4vw;background:#062b20;color:#fff8e6}
.film-player header,.film-player footer {display:flex;justify-content:space-between;align-items:center;gap:16px}
.film-player header a {padding:9px 13px;border:1px solid #a2cfa5;font-size:14px}
.film-player video {display:block;width:100%;height:100%;object-fit:contain;background:#02120d}
.film-player footer span {font:700 11px "Segoe UI",sans-serif;letter-spacing:.14em;color:#cbfa64}
:root {
  --display: Impact, "Arial Narrow", "Franklin Gothic Demi Cond", sans-serif;
  --lime: #d4ff54;
  --paper: #fff9e7;
  --asset-hockey: url('assets/hockey.jpg');
}
[hidden] {display:none!important}
.venue-brand {font:italic 900 clamp(27px,2.6vw,48px)/1 Georgia,serif; letter-spacing:-.08em; color:var(--paper)}
.venue-city {padding:5px 0 4px 13px; border-left:1px solid #f4f6df66; font:800 11px/1.1 "Segoe UI",sans-serif; letter-spacing:.17em; color:var(--paper)}
.sidebar .wordmark {align-items:flex-start; flex-direction:column}
.sidebar .venue-city {border:0; padding:0}
.launch {position:relative; isolation:isolate; width:100%; min-height:600px; height:100svh; display:flex; flex-direction:column; overflow:hidden; color:var(--paper); background:#073829; font-family:"Segoe UI",Arial,sans-serif}
.launch-photo,.intro-photo {position:absolute; z-index:-2; inset:0 0 0 26%; background:linear-gradient(90deg,#093626 0%,#0936263b 24%,transparent 55%),var(--asset-hockey) 62% center/cover}
.launch::before {content:""; position:absolute; z-index:-1; inset:0; background:linear-gradient(110deg,#073427 0%,#073427 35%,#073427c9 46%,transparent 65%),linear-gradient(0deg,#031b14de,transparent 32%,transparent 80%,#07171291)}
.launch::after {content:""; position:absolute; z-index:-1; inset:0; opacity:.45; background:repeating-linear-gradient(111deg,transparent 0 1.85vw,#8aff9810 1.86vw 1.92vw,transparent 1.93vw 2vw); clip-path:polygon(0 0,33% 0,12% 100%,0 100%)}
.launch-header,.launch-body,.launch-foot {margin-inline:clamp(28px,5.7vw,116px)}
.launch-header {display:flex; justify-content:space-between; align-items:center; padding:clamp(20px,3.2vh,48px) 0; border-bottom:1px solid #e1f5d669}

function note(ctx, bus, when, frequency, duration, volume, wave, endFrequency) {

  amp.gain.exponentialRampToValueAtTime(.0001, when + duration);
  osc.connect(amp).connect(bus);
  osc.start(when);
  osc.stop(when + duration + .01);
}

    const scenes = [
      {k:'O’LEARYS KARLSTAD', title:['DESTINATION','GAME NIGHT.'], photo:rink, foot:'KVÄLLENS MATCHFILM'},
      {k:'KVÄLLENS DESTINATION', title:['ROM.'], photo:rome, foot:'ITALIEN   /   TRE LEDTRÅDAR'},

    ];

    const duration = scenes.length*sceneTime;
    function draw(time) {

    });
    recorder.start(500);

    let last = -1;

      const t=Math.min(duration,(now-started)/1000);
      const index=draw(t);

  } catch (err) { tell('Matchfilmen kunde inte sparas. '+err.message); }

    cancelAnimationFrame(frameId);
    if(stream) stream.getTracks().forEach(t=>t.stop());
    await ac.close().catch(()=>{});
    button.disabled=false;button.textContent=original;recapRecording=false;
  }
}

// MediaRecorder writes VP8 and Opus into a WebM segment. Keep encoded frames
// and rebuild their cluster timestamps at the selected video keyframes.
function readWebm(bytes) {
  const SEGMENT=0x18538067, CLUSTER=0x1f43b675, INFO=0x1549a966, TRACKS=0x1654ae6b;
  function vint(offset, raw=false) {
    let marker=128, length=1;
    while (marker && !(bytes[offset]&marker)) {marker >>= 1;length++;}
    if (!marker || offset+length>bytes.length) throw Error('WebM innehåller en ogiltig elementlängd.');
    let value=raw ? bytes[offset] : bytes[offset]&(marker-1);
    let unknown=value===marker-1;
    for (let i=1;i<length;i++) {
      value=value*256+bytes[offset+i];
      unknown=unknown && bytes[offset+i]===255;
    }
    return {value,length,unknown};
  }
  function element(offset, limit) {
    const id=vint(offset,true);
    const size=vint(offset+id.length);
    const data=offset+id.length+size.length;
    const end=size.unknown ? limit : data+size.value;
    if (end>limit || end<data) throw Error('WebM-filen är ofullständig.');
    return {id:id.value,start:offset,data,end,unknown:size.unknown};
  }
  function children(start,end) {
    const items=[];
    for(let offset=start;offset<end;) {
      const entry=element(offset,end);
      items.push(entry);offset=entry.end;
    }
    return items;
  }
  function number(e) {
    let n=0;
    for(let i=e.data;i<e.end;i++) n=n*256+bytes[i];
    return n;
  }
  function packet(e,time,key) {
    const track=vint(e.data);
    const offset=e.data+track.length;
    const delta=(bytes[offset]<<8)|bytes[offset+1];
    const at=time+(delta&32768 ? delta-65536 : delta);
    return {at,track:track.value,key:key ?? Boolean(bytes[offset+2]&128),flags:bytes[offset+2]&0x0e,head:bytes.subarray(e.data,offset),data:bytes.subarray(offset+3,e.end)};
  }
  const ebml=element(0,bytes.length);
  const segment=element(ebml.end,bytes.length);
  if (ebml.id!==0x1a45dfa3 || segment.id!==SEGMENT) throw Error('Videokodaren returnerade inte WebM.');
  let tracks, info, videoTrack;
  let scale=1000000;
  const packets=[];
  const upperLevel=new Set([CLUSTER,TRACKS,INFO,0x114d9b74,0x1c53bb6b,0x1254c367,0x1043a770,0x1941a469]);
  for(let cursor=segment.data;cursor<segment.end;) {
    const top=element(cursor,segment.end);
    cursor=top.end;
    if (top.id===INFO) {
      info=children(top.data,top.end).filter(e=>[0x2ad7b1,0x4d80,0x5741].includes(e.id));
      const timescale=info.find(e=>e.id===0x2ad7b1);
      if (timescale) scale=number(timescale);
    }
    if (top.id===TRACKS) {
      tracks=bytes.subarray(top.start,top.end);
      for(const item of children(top.data,top.end).filter(e=>e.id===0xae)) {
        const fields=children(item.data,item.end);
        if (fields.some(e=>e.id===0x83 && number(e)===1)) videoTrack=number(fields.find(e=>e.id===0xd7));
      }
    }
    if(top.id!==CLUSTER) continue;
    let time=0;
    for(let position=top.data;position<top.end;) {
      const e=element(position,top.end);
      if(top.unknown && upperLevel.has(e.id)) {cursor=position;break;}
      position=e.end;
      if(e.id===0xe7) time=number(e);
      if(e.id===0xa3) packets.push(packet(e,time));
      if(e.id===0xa0) {
        const fields=children(e.data,e.end);
        const block=fields.find(field=>field.id===0xa1);
        if(block) packets.push(packet(block,time,!fields.some(field=>field.id===0xfb)));
      }
    }

  packets.sort((a,b)=>a.at-b.at || Number(videoKey(b))-Number(videoKey(a)));

  for(const p of packets) {
    if(videoKey(p)) groups.push({start:p.at,packets:[]});
    groups.at(-1)?.packets.push(p);
  }
  if(!groups.length) throw Error('Videon saknar startbilder för klippning.');
  const step=40000000/scale;
  groups.forEach((g,i)=>g.end=groups[i+1]?.start ?? (g.packets.at(-1).at+step));

    else if (view.phase === 'podium') {
      const high = Math.max(...view.teams.map(t => t.score));
      content = `<div class="team-empty"><div class="team-emblem" style="--team:${team.color}">✦</div><span class="section-kicker">FINALRESULTAT</span><h1>${team.score === high ? 'Vilken<br><em>seger!</em>' : 'Vilken<br><em>show!</em>'}</h1><p>Ni fick <b>${team.score} poäng</b>. Se resultatet på storbilden.</p></div>`;
    } else {
      const c = view.card;
      const own = view.answers[team.id] || { locked: false };
      const result = isResult(view);
      const canChoose = isTimed(view) && !own.locked && !view.paused;
      let message = '';
      if (view.paused) message = '<div class="team-message">Spelet är pausat. Producenten fortsätter snart.</div>';
      else if (own.locked && !result) message = `<div class="team-message success"><span>✓</span><div><b>Svaret är låst!</b><small>Ni valde ${letters[own.choice]}. Vänta på storbilden.</small></div></div>`;
      else if (result) message = `<div class="team-message ${own.points ? 'success' : ''}"><span>${own.points ? '✦' : '•'}</span><div><b>${own.points ? `+${own.points} poäng!` : 'Inga poäng den här gången.'}</b><small>${own.locked ? `Ert svar: ${letters[own.choice]}.` : 'Laget hann inte låsa ett svar.'}</small></div></div>`;
      content = `<div class="team-play"><div class="team-play-header"><div><span class="section-kicker">${esc(c.label)} ${c.stage ? `· LEDTRÅD ${c.stage}` : ''}</span><h1>${esc(c.clue || c.question)}</h1></div>${timerMarkup()}</div>
      ${message}<p class="choose-label">${result ? 'RÄTT SVAR ÄR MARKERAT' : own.locked ? 'ERT LÅSTA SVAR' : 'VÄLJ ETT SVAR'}</p>
      ${optionsMarkup(c, canChoose, own)}
      ${canChoose ? `<button class="lock-button" data-action="lock" ${selection === null ? 'disabled' : ''}><span class="lock-button-light"></span>LÅS SVARET</button><p class="lock-hint">Välj alternativ och tryck sedan på knappen. Låsta svar kan inte ändras.</p><p class="expired" data-expired hidden>Tiden är slut. Be producenten förlänga tiden om ni behöver.</p>` : ''}</div>`;
    }
    app.innerHTML = `<div class="team-shell" style="--team:${team.color}"><header class="team-header">${wordmark()}<div class="team-header-score"><span>${esc(team.name)}</span><b>${team.score} <small>P</small></b></div></header><main>${content}</main><footer>DESTINATION GAME NIGHT <span>·</span> ${esc(team.name)}</footer></div>`;
  }
  function renderTrailer() {
    document.body.className = 'screen-view';
    app.innerHTML = `<main class="film-player"><header>${wordmark()}<a href="?view=auto">Till startsidan ↗</a></header>
      <video controls playsinline preload="metadata" poster="${media('assets/football.jpg')}" src="${media('assets/trailer.mp4')}" aria-label="Destination Game Night, trailer med musik"></video>
      <footer><b>Destination Game Night</b><span>TRAILER &nbsp; / &nbsp; 24 SEK</span></footer></main>`;
  }
  function renderFilmCredits() {
    document.body.className = 'screen-view';
    app.innerHTML = `<main class="film-credits"><header>${wordmark()}<a href="?view=auto">Till startsidan ↗</a></header>
      <h1>Filmklipp och källor</h1><p>Inspelade filmklipp, klippta och omkodade utan originalljud.</p>
      <ul>${filmSources.map(clip=>`<li><a href="${clip.source}" target="_blank" rel="noopener">${esc(clip.title)}</a><span>${esc(clip.author)} · <a href="${clip.license}" target="_blank" rel="noopener">${filmLicenseName(clip.license)}</a>
      ${clip.archive ? ` · <a href="${clip.archive}" target="_blank" rel="noopener">Arkivkopia</a>` : ''}</span></li>`).join('')}</ul></main>`;
  }
  function render() {
    if (!view) return;
    renderedRevision = view.revision;
    if (role === 'screen' || role === 'auto' || stagePreview) renderScreen();
    else if (role === 'team') renderTeam();
    else if (role === 'trailer') renderTrailer();
    else renderHost();
    updateTimer();
    const intro = document.querySelector('[data-intro]');
    if (intro) setTimeout(() => intro.remove(), Math.max(0, 12000 - (Date.now() + serverOffset - view.eventAt)));
  }
  function playSound(type) {
    if (!audioContext || !soundEnabled) return;
    broadcastCue(audioContext,audioContext.destination,type);
  }
  document.addEventListener('input', e => {
    if (e.target.matches('[data-team-name]')) {
      namesDraft = namesDraft || view.teams.map(t => t.name);
      namesDraft[Number(e.target.dataset.teamName)] = e.target.value;
    }
  });
  document.addEventListener('change', e => {
    if (e.target.matches('[data-network]')) { addressIndex = Number(e.target.value); render(); }
  });
  document.addEventListener('click', async e => {
    const choice = e.target.closest('[data-choice]');
    if (choice) { selection = Number(choice.dataset.choice); render(); return; }
    const button = e.target.closest('[data-action]');
    if (!button || button.disabled) return;
    switch (button.dataset.action) {
      case 'open-screen':
        publicWindow = window.open('?view=screen&linked=1','dgn_tv','popup,width=1120,height=700');
        if (!publicWindow) toast('Tillåt popupfönstret eller välj Visa storbild här.');
        else publicWindow.focus();
        break;
      case 'save-names': await action({ type: 'NAMES', names: namesDraft || view.teams.map(t => t.name) }); namesDraft = null; break;
      case 'intro': if (!publicWindow || publicWindow.closed) { stagePreview = true; enableSound(); } await action({ type: 'INTRO' }); break;
      case 'show-stage': stagePreview = true; render(); break;
      case 'close-stage': stagePreview = false; render(); break;
      case 'host-pick': hostChoices[Number(button.dataset.team)] = Number(button.dataset.answer); render(); break;
      case 'host-lock': await action({ type: 'LOCK', team: Number(button.dataset.team), choice: hostChoices[Number(button.dataset.team)] }); break;
      case 'start-auto': startAuto(); break;
      case 'skip-demo': if (demoAdvance) demoAdvance(); break;
      case 'export-video': exportHighlights(view, media, button, toast); break;
      case 'next':
        if (view.phase === 'lobby') {
          if (namesDraft) { await action({ type: 'NAMES', names: namesDraft }); namesDraft = null; }
          if (manualIntro) break;
          if ((!publicWindow || publicWindow.closed) && !producer?.recording()) { stagePreview = true; enableSound(); }
          await action({ type: 'INTRO' });
          manualIntro = setTimeout(() => { manualIntro = 0; if (view.phase === 'lobby' && view.lastEvent === 'intro') action({type:'START'}); }, 7500);
          break;
        }
        await action({ type: view.phase === 'lobby' ? 'START' : 'NEXT' });
        break;
      case 'reveal': await action({ type: 'REVEAL' }); break;
      case 'pause': await action({ type: 'PAUSE' }); break;
      case 'resume': await action({ type: 'RESUME' }); break;
      case 'extend': await action({ type: 'EXTEND' }); break;
      case 'adjust': await action({ type: 'ADJUST', team: Number(button.dataset.team), delta: Number(button.dataset.delta) }); break;
      case 'reset':
        if (producer?.recording()) { toast('Stoppa inspelningen innan du nollställer spelet.'); break; }
        if (confirm('Starta ett nytt spel? Alla poäng och svar nollställs. Lagnamnen sparas.')) { clearTimeout(manualIntro); manualIntro = 0; await action({ type: 'RESET' }); }
        break;
      case 'lock': if (selection !== null) await action({ type: 'LOCK', team: teamId, choice: selection }); break;
      case 'fullscreen': if (!document.fullscreenElement && document.documentElement.requestFullscreen) await document.documentElement.requestFullscreen(); else if (document.fullscreenElement) await document.exitFullscreen(); break;
      case 'sound':
        soundEnabled = !soundEnabled;
        if (soundEnabled) { audioContext = audioContext || new (window.AudioContext || window.webkitAudioContext)(); await audioContext.resume(); playSound('transition'); }
        if (!soundEnabled && audioContext) await audioContext.suspend();
        button.textContent = soundEnabled ? 'Ljud på' : 'Slå på ljud';
        button.setAttribute('aria-pressed', String(soundEnabled));
        break;
    }
  });
  document.addEventListener('keydown', e => {
    if (role !== 'team' || !view || !isTimed(view) || view.paused || (view.answers[teamId] || {}).locked || /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
    const index = ['a', 'b', 'c', 'd'].indexOf(e.key.toLowerCase());
    if (index >= 0) { selection = index; render(); }
    else if ((e.key === 'Enter' || e.key === ' ') && selection !== null) { e.preventDefault(); action({ type: 'LOCK', team: teamId, choice: selection }); }
  });
  window.addEventListener('storage', e => { if (e.key === LOCAL_KEY && mode === 'local') refresh(); });
  function enableSound() {
    try {
      audioContext = audioContext || new (window.AudioContext || window.webkitAudioContext)();
      audioContext.resume().catch(() => {});
      soundEnabled = true;
    } catch (_) { soundEnabled = false; }
  }
  function startAuto() {
    autoStarted = true; mode = 'local';
    enableSound();
    let demo = DGN.create(['Rockets', 'Legends', 'Challengers', 'Champions']);
    const step = (a, now = Date.now(), questionDuration) => {
      demo = DGN.reduce(demo, a, now);
      if (questionDuration) demo.deadline = now + questionDuration;
      saveLocal(demo);
      refresh();
    };
    step({ type: 'INTRO' });
    const plan = [
      [8,'START',null,null,9],[12,'LOCK',1,0],[14,'LOCK',2,1],
      [17,'NEXT',null,null,9],[22,'LOCK',3,0],[26,'NEXT',null,null,8],[30,'LOCK',4,0],[34,'NEXT']
    ];
    Object.values(DGN.QUESTIONS).forEach((question, i) => {
      const begins = 48 + i*14;
      plan.push([begins,'NEXT',null,null,10]);
      [1,2,3,4].forEach(team => {
        const choice = team === 1 || (i+team)%3 ? question.correct : (question.correct+1)%4;
        plan.push([begins+3+team,'LOCK',team,choice]);
      });
      plan.push([begins+10,'NEXT']);
    });
    plan.push([146,'NEXT']);
    let index = 0, elapsed = 0, timer;
    function applyNext(skipping = false) {
      const [seconds,type,team,choice,duration] = plan[index++];
      elapsed = seconds;
      const now = skipping && type === 'LOCK' ? demo.opensAt : Date.now();
      if (type === 'LOCK' && demo.deadline < now) return;
      step({ type, team, choice }, now, duration ? duration*1000 : undefined);
    }
    function schedule() {
      if (index === plan.length) { demoAdvance = null; return; }
      timer = setTimeout(() => { applyNext(); schedule(); }, (plan[index][0] - elapsed)*1000);
    }
    demoAdvance = () => {
      clearTimeout(timer);
      const phase = demo.phase;
      while (index < plan.length && demo.phase === phase) applyNext(true);
      schedule();
    };
    schedule();
  }
  (async function init() {
    if (role === 'filmcredits') { renderFilmCredits(); return; }
    if (role === 'trailer') { renderTrailer(); return; }
    if (linkedScreen) {
      window.opener.postMessage('dgn-screen-ready', '*');
      setInterval(updateTimer, 200);
      return;
    }
    if (role === 'auto') saveLocal(DGN.create());
    else await detect();
    await refresh();
    if (role !== 'auto') setInterval(refresh, 850);
    setInterval(updateTimer, 200);
  })();
})();
</script>
</body>
</html>
